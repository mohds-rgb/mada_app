name: mada_app
description: "MADA | مدى — منصة توصيل ركاب وتوصيل طرود وتأجير سيارات (محافظة درعا) — تطبيق Flutter واحد بأربعة أدوار."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # -------- Firebase (Spark، بلا بطاقة بنكية) --------
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  firebase_crashlytics: ^4.1.3
  firebase_analytics: ^11.3.3

  # -------- إدارة الحالة --------
  flutter_riverpod: ^2.6.1

  # -------- التوجيه --------
  go_router: ^14.6.1

  # -------- التخزين المحلي --------
  shared_preferences: ^2.3.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # -------- الخرائط (OsmMapProvider نشط، بصفر تكلفة) --------
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  flutter_polyline_points: ^2.1.0
  geoflutterfire2: ^2.3.15

  # -------- تخزين الصور (CloudinaryStorageProvider نشط) --------
  http: ^1.2.2
  flutter_image_compress: ^2.3.0
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1

  # -------- عام --------
  intl: any
  google_fonts: ^6.2.1
  equatable: ^2.0.5
  uuid: ^4.5.1
  package_info_plus: ^8.1.1
  device_info_plus: ^11.1.1
  connectivity_plus: ^6.1.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  mockito: ^5.4.4
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  generate: true # يُفعّل توليد ملفات الترجمة (gen-l10n) تلقائياً عند flutter pub get / build

  assets:
    - assets/branding/
    - assets/fonts/

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
    # ملف واحد Variable Font (يحتوي كل الأوزان عبر محور wght) — فلاتر يدعم
    # الأوزان المتغيرة تلقائياً حسب FontWeight بالنص دون الحاجة لملفات منفصلة.
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Variable.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/mada_app_icon_final.png"
  min_sdk_android: 28
  adaptive_icon_background: "#0B1F3A"
  adaptive_icon_foreground: "assets/branding/mada_app_icon_final.png"



dependency_overrides:
  cloud_firestore: ^5.4.4
